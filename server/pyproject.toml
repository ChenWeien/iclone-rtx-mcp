[project]
name = "iclone-mcp"
version = "0.1.0"
description = "Local MCP bridge for iCloneQt"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "windows-capture>=2.0.1,<3 ; sys_platform == 'win32'",
]

[project.scripts]
iclone-mcp = "iclone_mcp.server:main"
iclone-mcp-2 = "iclone_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
